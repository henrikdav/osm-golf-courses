# Every Monday night, and by hand (Actions → Publish → Run workflow): test, fetch from Overpass, clean, check
# against what is published, and publish with GitHub Pages only when something changed and nothing looks broken.
name: Publish

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the cleaning
        run: python -m unittest -v
      - name: Fetch and clean
        run: python build.py --fetch
      - name: Compare with what is published
        id: check
        run: python check.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
